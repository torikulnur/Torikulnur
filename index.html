<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>T-Tech IPTV | Live Cyber Streaming</title>
    <style>
      html, body {
        background-color: #000000;
        color: #f3f4f6;
        margin: 0;
        padding: 0;
        height: 100%;
        overflow-x: hidden;
      }
      /* Loading screen preloader */
      #fallback-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #000000;
        z-index: 9999;
        font-family: 'Space Grotesk', system-ui, sans-serif;
        opacity: 1;
        transition: opacity 0.4s ease-out;
      }
      .cyber-spinner {
        width: 55px;
        height: 55px;
        border: 3px solid rgba(255, 159, 0, 0.08);
        border-top: 3px solid #ff9f00;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        box-shadow: 0 0 15px rgba(255, 159, 0, 0.35);
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <!-- Persistent neon layout preloader matching torikul.onrender.com with stable accent color -->
    <div id="fallback-loader">
      <div class="cyber-spinner"></div>
      <div style="margin-top: 1.5rem; font-weight: 700; letter-spacing: 0.15em; color: #ff9f00; text-shadow: 0 0 12px rgba(255, 159, 0, 0.6); font-size: 1.1rem;">T-TECH IPTV CONTROLLER</div>
      <div style="font-size: 0.75rem; color: #71717a; margin-top: 0.6rem; letter-spacing: 0.05em; font-family: monospace;">Launching High-Fidelity Cyber Systems...</div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <script>
      // Smoothly dismiss loading overlay when the application rendering context executes
      window.addEventListener('DOMContentLoaded', () => {
        const loader = document.getElementById('fallback-loader');
        if (loader) {
          loader.style.opacity = '0';
          setTimeout(() => loader.remove(), 400);
        }
      });
    </script>
  </body>
</html>
